
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lua Source Protector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #080b12;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #111827;
      border: 1px solid #263449;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 12px 40px #0008;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    p {
      color: #9eacc2;
      line-height: 1.6;
    }

    .status {
      margin-top: 22px;
      padding: 12px;
      border-radius: 8px;
      background: #172337;
      color: #79b8ff;
      font-size: 14px;
    }

    .footer {
      margin-top: 20px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Lua Source Protector</h1>

    <p>
      A private workspace for managing your Lua scripts.
    </p>

    <div class="status">
      Secure dashboard setup in progress
    </div>

    <div class="footer">
      Lua Source Protector
    </div>
  </main>
</body>
</html>
